
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | StockPilot</title>
</head>
<body>
    <main>
        <h1>Create your StockPilot account</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p role="alert">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.register') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="username">Username</label>
            <input id="username" name="username"
                   type="text" maxlength="80" required autocomplete="username">

            <label for="email">Email</label>
            <input id="email" name="email"
                   type="email" maxlength="254" required autocomplete="email">

            <label for="password">Password</label>
            <input id="password" name="password"
                   type="password" minlength="12" required
                   autocomplete="new-password">

            <button type="submit">Create account</button>
        </form>

        <p>Already registered?
            <a href="{{ url_for('auth.login') }}">Log in</a>
        </p>
    </main>
</body>
</html>
